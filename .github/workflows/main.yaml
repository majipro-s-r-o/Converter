name: Continues Integration

on:
    push:
        tags:
            - 'v*'

jobs:
    build:
        
        runs-on: ubuntu-latest
        
        permissions:
            # Checkout of the repository content.
            contents: read
            # Issuance of the OIDC token that nuget.org exchanges for a short-lived API key.
            id-token: write
        
        steps:
            -   uses: actions/checkout@v4
                with:
                    # Unshallow fetch of Git history allows correct version calculation.
                    fetch-depth: 0

            -   name: Setup .NET
                uses: actions/setup-dotnet@v4
                with:
                    dotnet-version: '10.0.x'

            -   name: Restore tools
                run: dotnet tool restore

            -   name: Restore dependencies
                run: dotnet restore

            -   name: Build
                run: dotnet build --configuration Release --no-restore

            -   name: Pack
                run: |
                    VERSION="${{ github.ref_name }}" 
                    VERSION="${VERSION#v}"
                    dotnet pack --no-build --configuration Release /p:Version="$VERSION" /p:AssemblyVersion="$VERSION" /p:InformationalVersion="$VERSION"  --output artifacts

            # The issued API key is valid for one hour, so it is requested right before the push.
            -   name: NuGet login
                id: nuget-login
                uses: NuGet/login@v1
                with:
                    user: jiri.paukert

            -   name: Publish
                run: dotnet nuget push "artifacts/*.nupkg" --skip-duplicate --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
