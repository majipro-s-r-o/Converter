name: Continues Integration

on:
    push:
        tags:
            - 'v*'

jobs:
    build:
        
        runs-on: ubuntu-latest
        
        permissions:
            # Checkout of the repository content.
            contents: read
            # Issuance of the OIDC token that nuget.org exchanges for a short-lived API key.
            id-token: write
        
        steps:
            -   uses: actions/checkout@v4
                with:
                    # Unshallow fetch of Git history allows correct version calculation.
                    fetch-depth: 0

            -   name: Setup .NET
                uses: actions/setup-dotnet@v4
                with:
                    dotnet-version: '10.0.x'

            -   name: Restore tools
                run: dotnet tool restore

            -   name: Restore dependencies
                run: dotnet restore

            -   name: Version
                # The tag is the version, and it has to reach the compiler, not only the packer:
                # packing does not build, so a version handed to it alone names the package and
                # leaves every assembly inside it saying 1.0.0.0. Version by itself is enough -
                # AssemblyVersion, FileVersion and InformationalVersion are all derived from it,
                # and a prerelease tag like v1.2.3-rc1 keeps working because AssemblyVersion is
                # derived from the part before the dash.
                run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

            -   name: Build
                run: dotnet build --configuration Release --no-restore /p:Version="$VERSION"

            -   name: Pack
                # One package: Majipro.Converter, carrying the runtime in lib/ and the generator in
                # analyzers/dotnet/cs. Converter.Abstrations and Converter.Generator are not
                # packable, so this produces exactly one file.
                run: dotnet pack --no-build --configuration Release /p:Version="$VERSION" --output artifacts

            # The issued API key is valid for one hour, so it is requested right before the push.
            -   name: NuGet login
                id: nuget-login
                uses: NuGet/login@v1
                with:
                    user: jiri.paukert

            -   name: Publish
                run: dotnet nuget push "artifacts/*.nupkg" --skip-duplicate --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
